<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mono StudyBot</title><style>:root{--bg:linear-gradient(135deg,#111827,#374151);--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.18)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#111827,#374151);font-family:Inter,system-ui,sans-serif;color:#fff;display:grid;place-items:center;padding:18px}.shell{width:min(900px,100%);height:min(760px,92vh);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(20px);border-radius:28px;overflow:hidden;box-shadow:0 25px 80px #0005}header{padding:24px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(24px,4vw,38px)}header p{margin:7px 0 0;opacity:.7}#messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:14px 17px;border-radius:18px;white-space:pre-wrap;line-height:1.5}.bot{background:#ffffff18;align-self:flex-start;border-bottom-left-radius:5px}.user{background:#fff;color:#111827;align-self:flex-end;border-bottom-right-radius:5px}form{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line)}input{flex:1;min-width:0;border:1px solid var(--line);background:#0003;color:#fff;padding:15px 17px;border-radius:16px;outline:none}button{border:0;border-radius:16px;padding:0 22px;font-weight:700;cursor:pointer;background:#fff;color:#111827}@media(max-width:520px){.shell{height:90vh;border-radius:20px}.msg{max-width:92%}button{padding:0 16px}}</style></head><body><main class="shell"><header><h1>Mono StudyBot</h1><p>Focused answers for your specified study topic</p></header><section id="messages"><div class="msg bot">Hello! Ask me a question related to your study title.</div></section><form id="form"><input id="input" placeholder="Ask a study question…" autocomplete="off"><button>Send</button></form></main><script>const form=document.querySelector('#form'),input=document.querySelector('#input'),messages=document.querySelector('#messages');function add(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';const wait=add('Thinking…','bot');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const data=await r.json();wait.textContent=data.reply||data.error||'No response.'}catch{wait.textContent='Unable to connect to the server.'}});</script></body></html>
